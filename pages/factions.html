<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Factions - Wargame List Builder</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/main.js"></script>
</head>

<body>
  <header>
    <h1>Wargame List Builder</h1>
    <nav>
      <ul>
        <li><a href="../index.html">Home</a></li>
        <li><a href="factions.html" class="active">Factions</a></li>
        <li><a href="units.html">Units</a></li>
        <li><a href="lists.html">Army Lists</a></li>
        <li><a href="admin.html">Admin</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="center">
      <div>
        <h2>Factions</h2>
        <p>Manage your army factions and their rules</p>
      </div>
      <div>
        <a class="btn" href="create-faction.html">Create Faction</a>
        <a class="btn" href="list-builder.html">Build Army List</a>
      </div>
    </div>

    <!-- Factions Grid - This will be populated with data later -->
    <div class="table-container">
      <div>
        <label for="search">Search Factions</label>
        <input type="text" id="search" placeholder="Search by name or tag...">
      </div>
      
      <div id="factions-table-container">
        <!-- Table will be inserted here by JavaScript -->
        <p>Loading factions...</p>
      </div>
    </div>

  </main>

<script>
    // Page-specific JavaScript for factions.html
    let allFactions = [];

    // Load factions when page loads
    window.addEventListener('DOMContentLoaded', async () => {
      await loadFactions();
      setupSearch();
    });

    // Store detachments for each faction
    let factionDetachments = {};

    async function loadFactions() {
      try {
        allFactions = await getAllFactions();
        
        // Load detachments for all factions
        const detachmentPromises = allFactions.map(faction => 
          getAllDetachments(faction.faction_id)
            .then(detachments => {
              factionDetachments[faction.faction_id] = detachments || [];
            })
            .catch(error => {
              console.error(`Failed to load detachments for faction ${faction.faction_id}:`, error);
              factionDetachments[faction.faction_id] = [];
            })
        );
        
        await Promise.all(detachmentPromises);
        displayFactions(allFactions);
      } catch (error) {
        displayError('Failed to load factions. Please try again later.', 'factions-table-container');
      }
    }

    function truncateText(text, maxLength) {
      if (!text) return '';
      if (text.length <= maxLength) return text;
      return text.substring(0, maxLength) + '...';
    }

    function formatDetachments(detachments) {
      if (!detachments || detachments.length === 0) {
        return '<span>None</span>';
      }
      
      // Show first 3 detachments
      const displayDetachments = detachments.slice(0, 3);
      let html = displayDetachments.map(d => `<span>${d.name}</span>`).join(' ');
      
      // If more than 3, add "+X more"
      if (detachments.length > 3) {
        const remaining = detachments.length - 3;
        html += ` <span>+${remaining}</span>`;
      }
      
      return html;
    }

    function displayFactions(factions) {
      const container = document.getElementById('factions-table-container');
      
      if (!factions || factions.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <h3>No Factions Found</h3>
            <p>Create your first faction to get started!</p>
            <a class="btn" href="create-faction.html">+ Create Faction</a>
          </div>
        `;
        return;
      }

      let tableHTML = `
        <table>
          <thead>
            <tr>
              <th>Faction Name</th>
              <th>Tags</th>
              <th>Army Rule</th>
              <th>Detachments</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
      `;

      factions.forEach(faction => {
        const tagsHTML = faction.tags && faction.tags.length > 0 
          ? faction.tags.map(tag => `<span>${tag}</span>`).join('')
          : '<span>None</span>';

        const truncatedDescription = truncateText(faction.description, 50);
        const detachments = factionDetachments[faction.faction_id] || [];
        const detachmentsHTML = formatDetachments(detachments);

        tableHTML += `
          <tr>
            <td>
              <strong>${faction.name || 'Unnamed Faction'}</strong>
              <br>
              <small>${truncatedDescription}</small>
            </td>
            <td>${tagsHTML}</td>
            <td>${faction.army_rule_name || 'No army rule'}</td>
            <td>${detachmentsHTML}</td>
            <td>
              <a class="btn" href="faction-detail.html?id=${faction.faction_id}">View Details</a>
              <button class="btn btn-secondary" onclick="deleteFactionConfirm('${faction.faction_id}', '${faction.name}')">Delete</button>
            </td>
          </tr>
        `;
      });

      tableHTML += `
          </tbody>
        </table>
      `;

      container.innerHTML = tableHTML;
    }

    function setupSearch() {
      const searchInput = document.getElementById('search');
      searchInput.addEventListener('input', (e) => {
        const searchTerm = e.target.value.toLowerCase();
        
        if (!searchTerm) {
          displayFactions(allFactions);
          return;
        }

        const filtered = allFactions.filter(faction => {
          const name = (faction.name || '').toLowerCase();
          const description = (faction.description || '').toLowerCase();
          const tags = (faction.tags || []).join(' ').toLowerCase();
          const armyRule = (faction.army_rule_name || '').toLowerCase();
          
          return name.includes(searchTerm) || 
                 description.includes(searchTerm) || 
                 tags.includes(searchTerm) ||
                 armyRule.includes(searchTerm);
        });

        displayFactions(filtered);
      });
    }

    async function deleteFactionConfirm(factionId, factionName) {
      if (confirm(`Are you sure you want to delete "${factionName}"? This cannot be undone.`)) {
        try {
          await deleteFaction(factionId);
          displaySuccess('Faction deleted successfully!');
          await loadFactions(); // Reload the list
        } catch (error) {
          displayError('Failed to delete faction. It may have units or lists associated with it.');
        }
      }
    }
  </script>
</body>
</html>
